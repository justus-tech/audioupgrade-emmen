# Instellingen voor de WhatsApp-ontvanger bij Cloudflare.
# Uitleg over wat dit is en hoe je het aanzet: zie LEESMIJ.md in deze map.
#
# Hier staan geen sleutels in. Die zet GitHub bij het publiceren als geheim
# bij Cloudflare neer (zie .github/workflows/whatsapp-ontvanger.yml).

name = "aue-whatsapp"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# De opslagbak voor de berichten. Dat hij in de EU staat, regelt worker.js.
[[durable_objects.bindings]]
name = "BAK"
class_name = "Berichtenbak"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Berichtenbak"]

[vars]
# Na zoveel dagen worden berichten automatisch gewist (AVG: niet langer
# bewaren dan nodig). Een offertetraject duurt zelden langer dan drie maanden.
BEWAAR_DAGEN = "90"
