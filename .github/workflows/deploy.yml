# Zet de site na elke wijziging live op audioupgradeemmen.nl.
#
# De site draait op GitHub Pages met het eigen domein. De DNS blijft bij
# TransIP: daar wijzen vier A-records naar GitHub. De nameservers zijn NIET
# verhuisd, want TransIP beheert DNSSEC automatisch en laat je die niet
# uitzetten — en met een verkeerde DNSSEC-handtekening ligt niet alleen de
# site plat maar ook de e-mail.
#
# Het bestand public/CNAME vertelt GitHub welk domein erbij hoort. Zonder dat
# bestand vergeet Pages het domein bij de eerstvolgende publicatie.

name: Site publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén tegelijk. Duw je twee wijzigingen snel achter elkaar, dan telt de
# laatste en wordt de eerste afgebroken.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouwen:
    name: Bouwen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: withastro/action@v3
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          # Zet de bezoekersteller aan. Staat alleen hier, dus alleen de
          # echte site telt mee — niet wat er op de laptop gebouwd wordt.
          METEN: '1'

  publiceren:
    name: Publiceren
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publiceren.outputs.page_url }}
    steps:
      - id: publiceren
        uses: actions/deploy-pages@v4
